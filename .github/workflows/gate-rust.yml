name: gate-rust

# Reusable Rust gate workflow — mirrors a Rust repo's planning/harness.json checks
# in declared order: fmt, clippy, test, build. Callers pass their own clippy args
# and runner OS; `needs-nextest` lets a repo (e.g. engine-rs) opt into
# `cargo nextest run` instead of plain `cargo test`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label (e.g. ubuntu-latest, macos-latest)"
        type: string
        default: ubuntu-latest
        required: false
      needs-nextest:
        description: "Install cargo-nextest and use it for the test gate"
        type: boolean
        default: false
        required: false
      clippy-args:
        description: "Args passed to `cargo clippy` after the crate selection, e.g. `-- -D warnings` or `--all-targets -- -D warnings`"
        type: string
        default: "-- -D warnings"
        required: false
      test-command:
        description: "Command used for the test gate when needs-nextest is true"
        type: string
        default: "cargo nextest run --workspace"
        required: false
      sibling-repo:
        description: "owner/repo of a sibling repo a workspace member path-depends on (e.g. engine-rs's `claude-code-rs = { path = \"../claude-code-rs\" }`), checked out one level above this repo's own checkout. Empty (default) skips this step."
        type: string
        default: ""
        required: false

jobs:
  gate:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute sibling checkout path
        if: ${{ inputs.sibling-repo != '' }}
        id: sibling
        run: echo "path=../$(basename ${{ inputs.sibling-repo }})" >> "$GITHUB_OUTPUT"

      - name: Checkout sibling repo (path dependency)
        if: ${{ inputs.sibling-repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.sibling-repo }}
          path: ${{ steps.sibling.outputs.path }}
          # actions/checkout resolves `path` relative to $GITHUB_WORKSPACE; a leading `../` lands
          # the sibling one level up, next to this repo's own checkout — matching the path-dependency
          # convention (`../<repo>`) that expects both repos checked out as siblings.

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Every eligible Rust repo's .cargo/config.toml sets `build.rustc-wrapper = "sccache"` for
      # local dev speed; without the binary present the hosted runner fails every cargo invocation
      # with "could not execute process `sccache ...`" before it even gets to fmt/clippy/test.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        if: ${{ inputs.needs-nextest }}
        uses: taiki-e/install-action@nextest

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy ${{ inputs.clippy-args }}

      - name: test (nextest)
        if: ${{ inputs.needs-nextest }}
        run: ${{ inputs.test-command }}

      - name: test (cargo test)
        if: ${{ !inputs.needs-nextest }}
        run: cargo test

      - name: build
        run: cargo build --release
