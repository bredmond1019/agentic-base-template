name: gate-rust

# Reusable Rust gate workflow — mirrors a Rust repo's planning/harness.json checks
# in declared order: fmt, clippy, test, build. Callers pass their own clippy args
# and runner OS; `needs-nextest` lets a repo (e.g. engine-rs) opt into
# `cargo nextest run` instead of plain `cargo test`.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label (e.g. ubuntu-latest, macos-latest)"
        type: string
        default: ubuntu-latest
        required: false
      needs-nextest:
        description: "Install cargo-nextest and use it for the test gate"
        type: boolean
        default: false
        required: false
      clippy-args:
        description: "Args passed to `cargo clippy` after the crate selection, e.g. `-- -D warnings` or `--all-targets -- -D warnings`"
        type: string
        default: "-- -D warnings"
        required: false
      test-command:
        description: "Command used for the test gate when needs-nextest is true"
        type: string
        default: "cargo nextest run --workspace"
        required: false
      sibling-repos:
        description: "Newline-separated owner/repo list of sibling repos a workspace member path-depends on (e.g. bastion's `mev = { path = \"../mev\" }`), each checked out one level above this repo's own checkout. Empty (default) skips this step."
        type: string
        default: ""
        required: false

jobs:
  gate:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout sibling repos (path dependencies)
        if: ${{ inputs.sibling-repos != '' }}
        env:
          SIBLING_REPOS: ${{ inputs.sibling-repos }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout's `path` input resolves relative to $GITHUB_WORKSPACE; a leading `../`
          # lands each sibling one level up, next to this repo's own checkout — matching the
          # path-dependency convention (`../<repo>`) that expects siblings checked out side by side.
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            name="$(basename "$repo")"
            echo "::group::Checkout sibling $repo -> ../$name"
            gh repo clone "$repo" "../$name" -- --depth 1
            echo "::endgroup::"
          done <<< "$SIBLING_REPOS"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Every eligible Rust repo's .cargo/config.toml sets `build.rustc-wrapper = "sccache"` for
      # local dev speed; without the binary present the hosted runner fails every cargo invocation
      # with "could not execute process `sccache ...`" before it even gets to fmt/clippy/test.
      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Install cargo-nextest
        if: ${{ inputs.needs-nextest }}
        uses: taiki-e/install-action@nextest

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy ${{ inputs.clippy-args }}

      - name: test (nextest)
        if: ${{ inputs.needs-nextest }}
        run: ${{ inputs.test-command }}

      - name: test (cargo test)
        if: ${{ !inputs.needs-nextest }}
        run: cargo test

      - name: build
        run: cargo build --release
