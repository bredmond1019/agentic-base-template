name: gate-node-docs

# Reusable node-docs gate workflow — mirrors base-template's own
# planning/harness.json gated checks in declared order: syntax-check the four
# SDLC engines with `node --check`, then the D54 sync-guard test suite.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label (e.g. ubuntu-latest)"
        type: string
        default: ubuntu-latest
        required: false

jobs:
  gate:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: engines-parse
        run: |
          # Glob rather than a hardcoded list: BT.ticket.retire-unused-engines deleted
          # sdlc-run.js and sdlc-block.js, and this loop kept naming them, so every PR
          # went red on MODULE_NOT_FOUND for four days. A glob cannot outlive its files.
          shopt -s nullglob
          engines=(.claude/workflows/sdlc-*.js)
          if [ ${#engines[@]} -eq 0 ]; then
            echo "no engines found at .claude/workflows/sdlc-*.js -- expected at least one" >&2
            exit 1
          fi
          for f in "${engines[@]}"; do
            echo "node --check $f"
            node --check "$f" || exit 1
          done

      - name: sync-guard-tests
        run: python3 scripts/test_sync_downstream_harness.py
