name: gate-python-uv

# Reusable Python (uv) gate workflow — mirrors orchestrator's 7 gated
# planning/harness.json checks in declared order: the CLAUDE.md standing-rules
# pattern scan, the two `database` import probes, ruff, pylint,
# `pytest --collect-only`, and pytest. The two advisory (gates: false) import
# checks in harness.json (app-import, worker-import) are intentionally not
# mirrored here — CI gates only on what harness.json gates on.
#
# The db-session/db-repository import probes run from the app/ subdir, matching
# harness.json's `cd app && ...` form; the rest run from the repo root.
#
# CHECKOUT DEPTH (added 2026-08-24): the caller repo is checked out at
# `mock-hq/core/orchestrator`, not the workspace root, so its own tests that
# compute an "HQ root" as `Path(__file__).resolve().parents[4]` (mirroring the
# real fleet's `HQ_ROOT/core/<repo>/tests/...` layout) resolve to `mock-hq/`
# here instead of an unrelated runner directory two levels above the checkout.
# `defaults.run.working-directory` below points every subsequent `run:` step
# at that nested path so none of them need editing individually.
# `tests/brain/test_golden_set_schema.py::test_expect_docs_paths_exist_on_disk`
# was silently guaranteed to fail before this — its `_HQ_ROOT` pointed at
# `/home/runner/work` (or equivalent), where no `expect_docs` path could ever
# exist, regardless of which golden-set fixture was in use.

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label (e.g. ubuntu-latest)"
        type: string
        default: ubuntu-latest
        required: false

jobs:
  gate:
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        working-directory: mock-hq/core/orchestrator
    services:
      postgres:
        # Stock `postgres:15` has no pgvector, so orchestrator's own
        # `enable_pgvector_extension` migration (`CREATE EXTENSION IF NOT
        # EXISTS vector;`) fails with `FeatureNotSupported: extension
        # "vector" is not available` the moment migrations actually run
        # against this service (see the "Apply DB migrations" step below,
        # added the same day this comment was).
        #
        # `supabase/postgres` (this repo's own local-dev choice per
        # docs/app-architecture-overview.md) was tried first and rejected —
        # verified locally with `docker run`: it needs Supabase's own
        # bootstrap stack (a `supabase_admin` role, JWT secrets, etc.) and
        # crash-loops on the plain POSTGRES_USER/PASSWORD/DB interface a bare
        # CI `services:` container provides. `pgvector/pgvector:pg15` is the
        # pgvector project's own image — stock Postgres 15 plus the
        # extension, nothing else — and was verified locally to accept the
        # standard env interface and `CREATE EXTENSION vector` cleanly.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: mock-hq/core/orchestrator

      - name: Checkout base-template for brain fixtures
        uses: actions/checkout@v4
        with:
          repository: bredmond1019/agentic-base-template
          path: _agentic-base-template

      - name: Link HQ fixtures for tests
        run: |
          cp ../../../_agentic-base-template/.github/mock-brain-fixtures/brain.toml ../../brain.toml
          mkdir -p planning
          cp ../../../_agentic-base-template/.github/mock-brain-fixtures/retrieval-golden-set.yaml planning/retrieval-golden-set.yaml

          # tests/brain/test_golden_set_schema.py::test_expect_docs_paths_exist_on_disk
          # resolves every non-abstain case's expect_docs entries against _HQ_ROOT
          # (../../ from here, matching the checkout depth above). This mock fixture's
          # own repo docs already exist for real (core/orchestrator/docs/*, tracked by
          # this repo); everything else it points at lives in sibling HQ tiers this CI
          # checkout never clones, so stub an empty placeholder at each such path —
          # content is irrelevant, only existence is asserted.
          for p in \
            business/docs/applications/distrito/posting.md \
            business/docs/interview-prep/paths/toptal/toptal-prep.md \
            business/docs/rates.md \
            core/orchestrator/planning/archive/index.md \
            core/orchestrator/planning/master-plan.md \
            core/orchestrator/planning/status.md \
            docs/content/blog-tracker.md \
            docs/content/ideas.md \
            docs/decisions/D12-filevault-disabled.md \
            docs/decisions/D20-shared-data-contract.md \
            docs/decisions/D26-bastion-system-naming-and-demand-first.md \
            docs/decisions/D47-workspace-contract.md \
            docs/decisions/D51-brain-engine-boundary-and-synapse.md \
            side/amistad/docs/business/amistad-brand-strategy.md \
            side/amistad/docs/business/amistad-product-roadmap.md \
          ; do
            mkdir -p "../../$(dirname "$p")"
            [ -f "../../$p" ] || echo "# CI mock stub — see gate-python-uv.yml" > "../../$p"
          done
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Apply DB migrations (alembic upgrade head)
        run: cd app && uv run alembic upgrade head

      - name: standing-rules (CLAUDE.md pattern scan)
        run: |
          set -e
          fail=0

          check() {
            id="$1"; pattern="$2"; paths="$3"; allow="$4"
            # shellcheck disable=SC2086
            matches=$(grep -rnE "$pattern" $paths 2>/dev/null || true)
            if [ -n "$allow" ] && [ -n "$matches" ]; then
              matches=$(printf '%s\n' "$matches" | grep -vE "$allow" || true)
            fi
            if [ -n "$matches" ]; then
              echo "FAIL[$id]:"
              printf '%s\n' "$matches"
              fail=1
            fi
          }

          check "f-string-in-logging" 'logging\.[a-z]+\(.*f["'"'"']' "--include=*.py app" ""
          check "open-without-encoding" 'open\(' "--include=*.py app" 'encoding=|#|\.open\('
          check "param-named-id" 'def [a-zA-Z_]+\([^)]*\bid\b' "--include=*.py app" 'obj_id|record_id|node_id|workflow_id|task_id|invalid'

          exit $fail

      - name: db-session-import
        run: cd app && uv run python -c 'import database.session'

      - name: db-repository-import
        run: cd app && uv run python -c 'import database.repository'

      - name: ruff (net-new-lint)
        run: uv run python -m ruff check app/ tests/

      - name: pylint
        run: uv run python -m pylint app/

      - name: pytest-count (collect-only)
        run: uv run python -m pytest --collect-only -q

      - name: pytest
        run: uv run python -m pytest
