# brain.toml — the portable definition of this brain (a future client gets their own)

[vocab]
layer = ["brain", "engine", "factory", "console", "surface", "infra", "business", "content", "meta"]
status = ["active", "draft", "deprecated", "superseded", "archived"]

[crawl]
# `_planning` — the per-tier vault container (`<tier>/_planning/<slug>/`) that holds the REAL
# bytes of each sub-repo's planning/, symlinked back as `<repo>/planning`. Pruned from the
# brain-root walk so the vault is not collected under the wrong (tier) scope; the mev corpus
# crawler re-collects it under the owning-repo scope via a manifest-driven per-root walk that
# follows the symlink. Keep in sync with index_brain.py's skip handling.
skip_dirs = ["target", "node_modules", ".git", ".claude", ".agent", ".repo-backups", "archive", "venv", ".venv", "sdlc", "_planning"]

[[repos]]
slug = "brain"
prefix = "HQ"
tier = "_root"
repo_path = "."
status_file = "planning/status.md"
cache_doc = "README.md"
heading = "Company Brain"

