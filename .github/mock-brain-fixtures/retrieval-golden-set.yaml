# planning/retrieval-golden-set.yaml — OR.K2 task 2, the hand-authored retrieval golden set.
#
# Hard rules (CLAUDE.md standing rule 1 + this block's Acceptance Criteria):
#   - Cap: 40 cases max (this file: 23).
#   - No LLM-generated cases anywhere — every query below is either one of the 13
#     archived `or-b-brain-retrieval-test-run1` queries (text preserved verbatim,
#     expectations re-derived against today's corpus), a hand-written
#     identifier-anchored/negative/hijack query, or lifted from
#     `planning/knowledge.md`'s brain-query-optimization convention. No case's
#     query text was generated by asking an LLM to produce a question from a
#     document (that trivially inflates recall and makes the harness lie).
#   - `score`/`via` fields quoted in `notes` below were captured 2026-08-01 via
#     `syn recall <query> --hybrid --json` / `retrieval_engine.retrieve(...)`
#     directly against the live corpus, not fabricated.
#
# Scoring contract (consumed by app/brain/eval/, OR.K2 task 3):
#   - `expect_docs`: set membership against the top-K result set's `doc_id` OR
#     `file_path` (either matching counts) — NOT rank-sensitive. Empty list is
#     valid (paired with `expect_abstain: true`) for cases with no correct
#     in-corpus answer.
#   - `expect_abstain`: true when the predicted-abstain rule
#     (`retrieval_confidence < 0.55`, app/schemas/document_qa_schema.py) SHOULD
#     fire — i.e. no correct answer exists in-corpus and the system should say
#     so rather than hallucinate a low-relevance hit.
#   - `scope`: optional `project` filter (D47 workspace contract) threaded into
#     `retrieval_engine.retrieve(..., filters={"project": scope})` — confirmed
#     2026-08-01 to scope correctly at the `retrieve()` layer independent of the
#     `~/.config/orchestrator/config.toml` `[workspaces]` table (that table is
#     `syn recall --workspace` CLI-name resolution only; the eval runner calls
#     `retrieval_engine.retrieve()` directly and passes `filters` itself).
#   - `notes`: provenance — what the 2026-07-03 archive verdict was (if
#     applicable) vs. what was re-derived today and why, plus raw score/via
#     evidence from the live corpus.
#
# IMPORTANT — exact-ID-hijack cases (see `hijack-*` and `archive-11-or-v` below):
#   The hijack bug (`find_exact_id` matching an incidental ID-shaped token,
#   then `exact_id_lookup`'s ILIKE returning zero rows instead of falling
#   through to semantic/hybrid search) lives ONLY in `app/brain/retrieval.py`'s
#   `recall()` non-hybrid dispatch (`syn recall <query>` with no `--hybrid`).
#   `retrieval_engine.retrieve()` — what this harness's runner calls (OR.K2
#   task 3) — is the promoted hybrid pipeline and has no ID short-circuit at
#   all, so it does NOT reproduce the hijack; these cases score against the
#   correct hybrid/semantic answer instead. They are kept in the golden set
#   anyway because (a) they are real, previously-documented defects worth a
#   fixture, (b) `archive-11-or-v` is the one case where hijack vs. hybrid
#   answers observably diverge (documented in `core/_planning/orchestrator/
#   status.md`'s 2026-07-15 entry), and (c) a future harness extension that
#   also scores `recall()`'s non-hybrid path (post-K2) can reuse them as-is.

